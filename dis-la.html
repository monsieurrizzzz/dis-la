<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a3453a'/%3E%3Crect x='12' y='6' width='8' height='14' rx='4' fill='none' stroke='%23f7f5f1' stroke-width='2.4'/%3E%3Cpath d='M8 15a8 8 0 0 0 16 0M16 23v4' fill='none' stroke='%23f7f5f1' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lato:wght@400;700;900&family=Playfair+Display:wght@400;700;900&display=swap">
<style>
/* Dis-la. Register: Desk (a screen Fan works in) inside the Français Quotidien visual family:
   same palette tokens, Playfair Display + Lato, 2px ink borders, 3px radius, pressable offset
   shadows. Every colour is a token. Dark mode: prefers-color-scheme, or [data-theme]. */
:root{
  color-scheme:light;
  --paper:#f7f5f1; --card:#fffdf9; --panel:#ece8e0;
  --ink:#1a1a1a; --ink2:#6e6b65; --label:#6b685f; --hair:#d8d5cf;
  --green:#3a7a5a; --ochre:#9a6a20; --blue:#4a7ab5; --redbrown:#a3453a; --violet:#6a4a9a; --sand:#b5ad94; --teal:#2a7a78;
  --on:#1c1a17;
  --t-green:rgba(58,122,90,.15); --t-red:rgba(163,69,58,.13); --t-ochre:rgba(154,106,32,.16); --t-ink:rgba(26,26,26,.06);
  --disp:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Lato","Helvetica Neue",Arial,sans-serif;
  --mono:"Courier New",Courier,monospace;
  --dockh:104px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141414; --card:#1f1e1c; --panel:#2a2926;
    --ink:#ece8e0; --ink2:#a49d92; --label:#8b857a; --hair:#2c2c2a;
    --green:#6cb98d; --ochre:#c89b4a; --blue:#7ba7dd; --redbrown:#d9756a; --violet:#a58bd6; --sand:#b5ad94; --teal:#5bb3b0;
    --t-green:rgba(108,185,141,.18); --t-red:rgba(217,117,106,.17); --t-ochre:rgba(200,155,74,.2); --t-ink:rgba(236,232,224,.07);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141414; --card:#1f1e1c; --panel:#2a2926;
  --ink:#ece8e0; --ink2:#a49d92; --label:#8b857a; --hair:#2c2c2a;
  --green:#6cb98d; --ochre:#c89b4a; --blue:#7ba7dd; --redbrown:#d9756a; --violet:#a58bd6; --sand:#b5ad94; --teal:#5bb3b0;
  --t-green:rgba(108,185,141,.18); --t-red:rgba(217,117,106,.17); --t-ochre:rgba(200,155,74,.2); --t-ink:rgba(236,232,224,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(var(--dockh) + 28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.lb{font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--label);margin:0}
.plain{margin:0;font-size:14px;line-height:1.45;color:var(--ink)}
.mut{color:var(--ink2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 12px}
h1{font-family:var(--disp);font-weight:400;font-size:32px;line-height:1;margin:0}
.theme{display:flex;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--card)}
.theme button{width:36px;height:34px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.theme button+button{border-left:2px solid var(--ink)}
.theme button svg{width:17px;height:17px}
.theme button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.note{margin:0 0 12px;padding:9px 12px;border:2px solid var(--redbrown);border-radius:3px;background:var(--t-red);font-size:13.5px;line-height:1.4}

/* segmented */
.seg{display:flex;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--card)}
.seg button{flex:1;white-space:nowrap;min-height:44px;border:0;background:none;font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--ink);cursor:pointer;padding:0 8px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg.sm button{min-height:36px;font-size:12px}
#modes{margin-bottom:16px}

/* cards */
.card{border:2px solid var(--ink);border-radius:4px;background:var(--card);padding:14px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);
  font-weight:700;font-size:13px;letter-spacing:.03em;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn svg{width:18px;height:18px}
.btn.sm{min-height:36px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.rbtn{width:44px;height:44px;border-radius:50%;padding:0}
.rbtn svg{width:20px;height:20px}
.spk{width:44px;height:44px;flex:none;border:2px solid var(--ink);border-radius:50%;background:var(--ochre);color:var(--on);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.spk:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.spk svg{width:19px;height:19px;stroke:var(--on)}
.spk.on{background:var(--green)}
.spk.sm{width:34px;height:34px;box-shadow:0 2px 0 var(--ink)}
.spk.sm:active{box-shadow:0 0 0 var(--ink);transform:translateY(2px)}
.spk.sm svg{width:15px;height:15px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;border:2px solid var(--ink);background:var(--panel);cursor:pointer;flex:none;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .15s,background .15s}
.sw[aria-checked=true]{background:var(--green)}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--paper)}
.sw[disabled]{opacity:.4;cursor:default}
.swrow{display:flex;align-items:center;gap:10px;min-height:44px}
.swrow span{font-size:13.5px}

/* dock: record button bottom-left (left thumb) */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--ink)}
.dockin{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.rec{position:relative;width:72px;height:72px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--redbrown);color:var(--paper);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.rec:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.rec svg{width:30px;height:30px;stroke:var(--paper)}
.rec[aria-disabled=true]{opacity:.4}
.rec.live::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--redbrown);animation:ring 1.3s ease-out infinite}
@keyframes ring{0%{transform:scale(.88);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.dockside{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);min-width:56px}
.act .rbtn{box-shadow:0 3px 0 var(--ink)}
.act small{font-weight:700;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.act:active .rbtn{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.act .rbtn.on{background:var(--green);color:var(--on)}
.act[disabled]{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--ink2);margin:0;line-height:1.35}
.meterbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.meter{height:12px;border:2px solid var(--ink);border-radius:3px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;width:calc(var(--lvl,0)*100%);background:var(--green);transition:width .06s linear}
.meter.hot i{background:var(--redbrown)}
.meterbox small{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* Phrases */
.sentcount{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sent-text{font-family:var(--disp);font-size:27px;line-height:1.22;margin:0 0 10px;overflow-wrap:anywhere}
.ipa-row{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.ipa-line{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--ink2);letter-spacing:.01em;overflow-wrap:anywhere}
.navrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.navrow .cnt{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink2)}
.field{width:100%;min-height:46px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);padding:8px 12px;font-size:16px;font-family:var(--body)}
.field::placeholder{color:var(--label)}
.voicerow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}
.voicerow select{min-height:36px;border:2px solid var(--ink);border-radius:3px;background:var(--card);padding:0 8px;font-size:13px;max-width:100%}
.strip{margin:0 0 14px}
.strip .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:2px solid var(--ink);border-radius:3px;background:var(--card);padding:0 10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip .sym{font-family:var(--mono);font-weight:400;font-size:14px}
.chip .n{background:var(--ink);color:var(--paper);border-radius:10px;min-width:20px;padding:0 6px;text-align:center;font-size:11px;line-height:20px}
.chip svg{width:14px;height:14px}

/* result blocks */
.blk{border:2px solid var(--ink);border-radius:4px;background:var(--card);padding:12px 14px;margin:0 0 12px}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.tag{font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--label);color:var(--ink2);border-radius:20px;padding:1px 8px}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.warn{border-color:var(--ochre);color:var(--ochre)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.wp{display:inline-flex;flex-direction:column;align-items:flex-start;border:2px solid var(--green);background:var(--t-green);border-radius:3px;padding:3px 10px 4px;font-family:var(--disp);font-size:19px;line-height:1.25}
.wp.bad{border-color:var(--redbrown);background:var(--t-red)}
.wp small{font-family:var(--body);font-weight:700;font-size:11px;color:var(--redbrown);line-height:1.2;margin-top:1px}
.wp.dim{border-color:var(--hair);background:var(--t-ink)}
.stats{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;margin:0 0 10px}
.stat{border:1.5px solid var(--hair);border-radius:3px;padding:7px 8px 6px;min-width:0}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:25px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat small{display:block;font-weight:700;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);margin-top:2px}
.stat i{display:block;font-style:normal;font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.25}
.gauge{margin-top:5px}
.fix{display:flex;gap:12px;align-items:flex-start}
.fixicon{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ochre);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;color:var(--on);border:2px solid var(--ink)}
.fix h3{font-family:var(--disp);font-weight:400;font-size:21px;line-height:1.15;margin:0 0 4px}
.fix p{margin:0 0 8px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper);padding:2px 4px 2px 10px;font-family:var(--disp);font-size:16px;min-height:34px}
.cap{font-size:11.5px;color:var(--ink2);margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.svgbox{width:100%}
.svgbox svg{width:100%;height:auto;overflow:visible}
svg text{font-family:var(--mono);fill:var(--ink2);stroke:none}
.seg-line{margin:0 0 6px}
.altline{font-size:12.5px;color:var(--ink2);margin:2px 0 0}
.altline b{color:var(--ink)}
.uncl{border-bottom:2px dotted var(--redbrown)}

/* Sons */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:68px;padding:8px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--card);cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.tile b{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.1}
.tile span{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:pre}
.tile[aria-pressed=true]{background:var(--t-ochre);border-color:var(--ink)}
.tile[aria-pressed=true] b{text-decoration:underline;text-decoration-color:var(--ochre);text-decoration-thickness:3px;text-underline-offset:4px}
.tile.wide{grid-column:span 2}
.modelrow{display:flex;align-items:center;gap:12px;margin:12px 0 10px}
.modelrow .w{font-family:var(--disp);font-size:34px;line-height:1.05}
.modelrow .ipa-line{flex:none;font-size:14px}
.pair{font-size:12.5px;color:var(--ink2);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.verdict{margin:10px 0 0;font-size:15px;font-weight:700}
.verdict.ok{color:var(--green)}
.verdict.bad{color:var(--redbrown)}
.nums{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:4px 0 0}

/* footer */
.foot{margin-top:18px;border-top:1px solid var(--hair);padding-top:12px}
.foot p{margin:0 0 10px;font-size:12px;color:var(--ink2);line-height:1.45}
.foot .row{gap:10px;flex-wrap:wrap}
.foot textarea{width:100%;min-height:120px;border:2px solid var(--ink);border-radius:3px;background:var(--paper);font-family:var(--mono);font-size:12px;padding:8px;margin-top:10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--dockh) + 18px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:30}
.toast div{background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px;max-width:100%;text-align:center}
.busy{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13.5px;margin:0 0 12px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#dock{display:none}}

/* chart + gauge parts (SVG) */
.g-track{fill:var(--hair);stroke:none}.g-zone{fill:var(--green);opacity:.4;stroke:none}.g-mark{fill:var(--ink);stroke:none}
.axis{stroke:var(--ink);stroke-width:1.5}
.bar{fill:var(--ink);stroke:none;opacity:.85}.bar.last{fill:var(--ochre);opacity:1}
.m-band{fill:var(--ochre);opacity:.22;stroke:none}
.m-grid{stroke:var(--hair);stroke-width:1}
.m-zero{stroke:var(--label);stroke-width:1;stroke-dasharray:3 4}
.m-line{fill:none;stroke:var(--ink);stroke-width:2.4}
.m-end{fill:none;stroke-width:4.5}.m-end.ok{stroke:var(--green)}.m-end.bad{stroke:var(--redbrown)}.m-end.neu{stroke:var(--ochre)}
.m-dot{stroke:var(--card);stroke-width:2}.m-dot.ok{fill:var(--green)}.m-dot.bad{fill:var(--redbrown)}.m-dot.neu{fill:var(--ochre)}
.m-frame{fill:var(--ink);opacity:.3;stroke:none}
.c-frame{fill:none;stroke:var(--ink);stroke-width:1.5}
.z-oth{fill:var(--t-ink);stroke:var(--hair);stroke-width:1}
.z-mate{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3}
.z-tgt{fill:var(--t-ochre);stroke:var(--ochre);stroke-width:2.2}
svg text.zl{fill:var(--ink2);stroke:var(--card);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}svg text.zl.t{fill:var(--ink);font-weight:700}
.lg-band{background:var(--ochre);opacity:.45}.lg-line{background:var(--ink);height:3px!important;vertical-align:2px}

/* ===== version 3 ===== */
/* header: back to the app, title, settings */
.top{justify-content:flex-start}
.top h1{flex:1;margin:0}
.back{text-decoration:none;color:var(--ink)}
.grow{flex:1}

/* sentence card */
.sentcard .sentcount{gap:10px}
.sentcard .ipa-line{display:block;margin:0 0 14px}
.actrow{display:flex;align-items:center;gap:10px}
.customrow{margin-top:12px}
.chipbtn{min-height:36px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--ink)}
.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.qdots{display:flex;gap:7px;flex:1;justify-content:center;align-items:center}
.qd{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:block}
.qd.cur{box-shadow:0 0 0 3px var(--t-ochre)}
.qd.ok{background:var(--green);border-color:var(--green)}
.qd.bad{background:var(--redbrown);border-color:var(--redbrown)}
.wd{border-radius:3px;padding:0 3px;margin:0 -1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wd.ok{background:var(--t-green);box-shadow:inset 0 -3px 0 var(--green)}
.wd.bad{background:var(--t-red);box-shadow:inset 0 -3px 0 var(--redbrown)}

/* result chips (layout a) */
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.rchip{display:flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 6px;border:2px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.rchip:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.rchip.open{background:var(--t-ochre)}
.rchip[disabled]{opacity:.55;box-shadow:none;cursor:default}
.rchip .ri{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--paper)}
.rchip .ri svg{width:13px;height:13px;stroke-width:3.2}
.rchip.ok .ri{background:var(--green)}.rchip.bad .ri{background:var(--redbrown)}.rchip.warn .ri{background:var(--ochre)}
.rchip.na .ri{background:var(--hair);color:var(--ink2)}
.rchip .rs{font-weight:400;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.blk.pic{padding:10px 12px}
.blk.pic .verdict{margin:6px 0 0;font-size:14px}

/* Sons: sound chips in one scrolling row, the vowel map first */
.soundrow{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 8px;scroll-padding:0 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.soundrow::-webkit-scrollbar{display:none}
.soundrow .tile{flex:none;scroll-snap-align:start;min-height:56px;min-width:80px;padding:6px 12px;align-items:center}
.soundrow .tile b{font-size:17px;white-space:nowrap}
.chartcard{padding:10px 10px 8px}
.chartcard .cap{margin:4px 4px 0}
.m-hist{fill:none;stroke:var(--ink);stroke-width:1.6}
.m-hist.ok{stroke:var(--green)}
.m-live{fill:var(--ink);stroke:var(--card);stroke-width:2.5}
.m-live.ok{fill:var(--green)}
.m-live.idle{opacity:.25}
.m-trail{fill:var(--ink);stroke:none}
.z-tgt.hit{fill:var(--t-green);stroke:var(--green)}
.vchips{margin:0 0 4px}
.vchip[aria-pressed=true]{background:var(--t-ochre)}

/* settings sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:relative;width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-panel h2{font-family:var(--disp);font-weight:400;font-size:26px;margin:0 0 12px}
.srow{margin:0 0 14px}
.srow .lb{margin:0 0 6px}
html.sheet-open{overflow:hidden}
.cap.mut{color:var(--ink2)}
.srow .theme{display:inline-flex}
.card>.lb+.plain,.card>.lb+.chips,.card>.lb+.svgbox{margin-top:8px}
.dockside .act small{color:var(--ink2)}

/* ===== version 3.1: more compact, less scrolling ===== */
.wrap{padding-top:max(8px,env(safe-area-inset-top))}
.top{margin:0 0 8px;gap:10px}
h1{font-size:28px}
.rbtn{width:40px;height:40px}
.rbtn svg{width:19px;height:19px}
.seg button{min-height:38px}
.seg.sm button{min-height:34px}
.card{padding:10px 12px;margin:0 0 10px}
.sentcount{margin-bottom:4px}
.sent-text{font-size:25px;line-height:1.18;margin:0 0 6px}
.sentcard .ipa-line{margin:0 0 8px}
.ipa-row{margin:0 0 8px}
.customrow{margin-top:8px}
.strip{margin:0 0 10px}
.strip .chips{margin-top:6px;gap:6px}
.chip{min-height:36px}
.blk{padding:9px 12px 10px;margin:0 0 9px}
.blk-h{margin:0 0 6px}
.wp{font-size:18px;padding:2px 9px 3px}
.stats{gap:6px;margin:0 0 6px}
.stat{padding:5px 7px 4px}
.stat b{font-size:22px}
.fix{gap:10px}
.fixicon{width:30px;height:30px}
.fix h3{font-size:19px;margin:0 0 2px}
.fix p{margin:0 0 6px}
.verdict{margin:6px 0 0;font-size:14.5px}
.legend{margin-top:4px;gap:4px 12px}
.cap{margin:4px 0 0}
.tiles{gap:8px;margin:0 0 10px}
.tile{min-height:56px;padding:6px 10px}
.soundrow{margin-bottom:8px}
.note{margin:0 0 8px;padding:7px 10px}
.rchip{min-height:44px}
.chips3{margin:0 0 8px}
/* the end-of-session line: saving to Français Quotidien */
#sumSend{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:12px 0 0}
#sumSend p{margin:0}
#sumCode{width:100%;font:12px/1.35 var(--mono);color:var(--ink);background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:8px;word-break:break-all;resize:none}
.chartcard{padding:8px 8px 6px}
.chartcard .cap{margin:2px 4px 0}

/*FKL-TOKENS:BEGIN (one table, stamped into both pages)*/
:root{--paper:#f6f1e8;--card:#fffdf8;--panel:#efe7d6;--ink:#1f1b16;--ink2:#6b6358;--label:#6b6358;--hair:#e2d9c8;--green:#2f7d4f;--ochre:#c2581a;--blue:#2b4a6f;--redbrown:#a63a2e;--on:#fffdf8;--acc:#2b4a6f;--on-acc:#fffdf8;--you:#c2581a;--accent:#c2581a;--mut:#6b6358;--line:#e2d9c8;--bg:#f6f1e8;--chip:#efe7d6;--warn:#b5651d;--t-green:rgba(47,125,79,0.15);--t-red:rgba(166,58,46,0.13);--t-ochre:rgba(194,88,26,0.14);--t-ink:rgba(31,27,22,0.06);color-scheme:light}

:root[data-theme="dark"]{--paper:#181512;--card:#221e19;--panel:#2c2720;--ink:#f1ebdf;--ink2:#a39a8b;--label:#a39a8b;--hair:#38322a;--green:#6fc08f;--ochre:#d4753a;--blue:#8fb1d9;--redbrown:#e27d70;--on:#181512;--acc:#8fb1d9;--on-acc:#181512;--you:#d4753a;--accent:#d4753a;--mut:#a39a8b;--line:#38322a;--bg:#181512;--chip:#2c2720;--warn:#e0a05a;--t-green:rgba(111,192,143,0.18);--t-red:rgba(226,125,112,0.17);--t-ochre:rgba(212,117,58,0.2);--t-ink:rgba(241,235,223,0.07);color-scheme:dark}
/*FKL-TOKENS:END*/
/*FKL-PICS:BEGIN*/
.fkl-pics{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.fkl-pics{grid-template-columns:1fr 1fr}}
.fkl-pic{margin:0;border:1px solid var(--hair);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--card)}
.fkl-pic.fr{border:2px solid var(--you);padding:7px 7px 9px}
.fkl-lbl{font-family:Lato,system-ui,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;line-height:1.2}
.fkl-mth{background:#fbf7ee;border-radius:12px;overflow:hidden;line-height:0}
.fkl-mth svg{display:block;width:100%;height:auto}
.fkl-pic figcaption{display:flex;flex-direction:column;gap:1px;font-family:Lato,system-ui,sans-serif}
.fkl-pic figcaption b{font-size:1.25rem;font-weight:700;line-height:1.2;color:var(--ink)}
.fkl-pic figcaption span{font-size:.85rem;line-height:1.35;color:var(--ink2)}
.fkl-note{font-family:Lato,system-ui,sans-serif;font-size:.85rem;line-height:1.4;color:var(--ink2);margin:8px 0 0}
/*FKL-PICS:END*/
/* ===== version 3.2: the same look as Ma prononciation. Colours come from the shared token table above; shapes are set here ===== */
:root{--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
html,body{background:var(--paper)}
h1{font-weight:900}
.lb{color:var(--mut)}
.theme{border:1px solid var(--line);border-radius:99px;background:var(--card)}
.theme button+button{border-left:1px solid var(--line)}
.theme button[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.seg{border:0;border-radius:14px;background:var(--chip);padding:4px;gap:4px}
.seg button{border-radius:10px;color:var(--mut)}
.seg button+button{border-left:0}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.card,.blk{border:1px solid var(--line);border-radius:16px}
.btn{border:1px solid var(--line);border-radius:12px;background:var(--chip);box-shadow:none}
.btn:active{transform:none;box-shadow:none;background:var(--acc);color:var(--on-acc)}
.rbtn{border-radius:50%}
.spk{background:var(--chip);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.spk svg{stroke:var(--ink)}
.spk:active{transform:none;box-shadow:none}
.spk.on{background:var(--acc)}
.spk.on svg{stroke:var(--on-acc)}
.spk.sm{box-shadow:none}
.sw{border:1px solid var(--line)}
#dock{border-top:1px solid var(--line);background:var(--paper)}
.rec{border:0;background:var(--bad);color:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.rec svg{stroke:var(--card)}
.rec:active{transform:scale(.96);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.act .rbtn{box-shadow:none;background:var(--chip)}
.act:active .rbtn{transform:none;background:var(--acc);color:var(--on-acc)}
.act .rbtn.on{background:var(--acc);color:var(--on-acc)}
.meter{border:1px solid var(--line);border-radius:6px}
.field{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.voicerow select{border:1px solid var(--line);border-radius:10px}
.chip{border:1px solid var(--line);border-radius:99px;box-shadow:none;background:var(--card)}
.chip:active{transform:none;background:var(--acc);color:var(--on-acc)}
.chip .n{background:var(--acc);color:var(--on-acc)}
.chipbtn{border:1px solid var(--line);border-radius:99px;background:var(--card)}
.chipbtn[aria-pressed=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.rchip{border:1px solid var(--line);border-radius:12px;box-shadow:none;background:var(--card)}
.rchip:active{transform:none}
.rchip.open{background:var(--t-ochre)}
.wp{border-width:1.5px;border-radius:10px}
.wchip{border:1px solid var(--line);border-radius:99px;background:var(--card)}
.stat{border-radius:10px}
.fixicon{border:0}
.tile{border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:none;color:var(--ink)}
.tile:active{transform:none;box-shadow:none}
.tile b{font-weight:700}
.tile span{color:var(--mut)}
.tile[aria-pressed=true]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.tile[aria-pressed=true] b{text-decoration:none}
.tile[aria-pressed=true] span{color:var(--on-acc);opacity:.85}
.modelrow .w{font-weight:900}
.note{border:1px solid var(--bad);border-radius:12px}
.toast div{border-radius:999px}
.sheet-panel{border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}
#sumCode{border-radius:10px}
.foot textarea{border:1px solid var(--line);border-radius:10px}
.qd{border-width:1.5px}
.qd.cur{box-shadow:0 0 0 3px var(--t-ochre)}
.z-tgt{fill:var(--t-ochre);stroke:var(--you)}
.axis,.c-frame{stroke:var(--mut)}
/* new in 3.2: the sounds from your lessons, the Lessons button, the mouth card */
.fromlessons{margin:0 0 10px}
.fromlessons .lb{margin:0 0 6px}
.ftiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ftile{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:60px;padding:6px 12px 8px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.ftile small{font-size:12px;font-weight:700;color:var(--mut);line-height:1.3}
.ftile b{font-family:var(--disp);font-weight:900;font-size:20px;line-height:1.15;white-space:nowrap}
.ftile[aria-pressed=true]{border:2px solid var(--acc);padding:5px 11px 7px}
.lessonsbtn{min-height:40px;padding:0 14px 0 8px;border-radius:99px;text-decoration:none;gap:2px;font-size:14px}
.lessonsbtn svg{width:20px;height:20px}
.mouthbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.mouthbox>.lb{margin:0 0 8px}

    out.appendChild(block('Heard', r.ok ? 'ok' : null, 'ok', body));
    saveAttempt({ t: new Date().toISOString(), mode: 'drill', sentence: d.w, words: [{ word: d.w, ok: r.ok, heard: r.heard }], missed: r.ok ? [] : [d.w], patterns: r.ok ? [] : [d.pat], rhythm: null, melody: null, wordsState: 'ok', audioState: take.audioState });
    renderStrip();
  }

  /* ==========================================================================================
     SUIVI: what to work on, where each vowel has landed, how many takes per day
     ========================================================================================== */
  function buildSuivi() {
    clear($('m-suivi')).appendChild(h('div', { id: 'suOut' }));
  }
  function dayKey(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function activityBars() {
    var days = [], now = new Date(), i;
    for (i = 13; i >= 0; i--) { var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); days.push({ k: dayKey(d), n: 0, d: d }); }
    var idx = {}; days.forEach(function (x, j) { idx[x.k] = j; });
    ATT.concat(VH).forEach(function (a) {
      var t = new Date(a.t); if (isNaN(t.getTime())) return;
      var j = idx[dayKey(t)]; if (j != null) days[j].n++;
    });
    var max = 0, total = 0; days.forEach(function (x) { total += x.n; if (x.n > max) max = x.n; });
    return { days: days, max: max, total: total };
  }
  function activitySvg(a) {
    var W = 340, H = 86, pl = 4, pr = 4, base = 66, top = 8, n = a.days.length, bw = (W - pl - pr) / n;
    var s = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Takes per day, last 14 days' });
    s.appendChild(sv('line', { x1: pl, y1: base + 0.5, x2: W - pr, y2: base + 0.5, class: 'axis' }));
    a.days.forEach(function (x, j) {
      var hgt = a.max ? (base - top) * x.n / a.max : 0, cx = pl + bw * j + bw / 2;
      if (x.n) s.appendChild(sv('rect', { x: (cx - bw * 0.3).toFixed(1), y: (base - hgt).toFixed(1), width: (bw * 0.6).toFixed(1), height: hgt.toFixed(1), rx: 2, class: 'bar' + (j === n - 1 ? ' last' : '') }));
      if (j === 0 || j === n - 1 || x.d.getDay() === 1) s.appendChild(svgText(cx.toFixed(1), base + 14, String(x.d.getDate()), { 'text-anchor': 'middle', 'font-size': 8.5 }));
    });
    return s;
  }
  function renderSuivi() {
    var out = clear($('suOut'));
    if (!ATT.length && !VH.length) {
      out.appendChild(h('div', { class: 'card' }, [
        h('p', { class: 'lb', text: 'Suivi' }),
        h('p', { class: 'plain', text: 'Nothing yet. Record a sentence or hold a vowel, and your progress shows here.' }),
        h('div', { class: 'row wrapr', style: 'margin-top:14px' }, [
          h('button', { type: 'button', class: 'btn', id: 'goPhrases', text: 'Phrases', onclick: function () { showMode('phrases'); } }),
          h('button', { type: 'button', class: 'btn', id: 'goSons', text: 'Sons', onclick: function () { showMode('sons'); } })
        ])
      ]));
      return;
    }
    var top = TXT.topPatterns(ATT, 3);
    out.appendChild(h('div', { class: 'card' }, [
      h('p', { class: 'lb', text: 'Sons à travailler' }),
      top.length ? patternChips(top) : h('p', { class: 'plain mut', text: 'No missed sounds yet.' })
    ]));
    /* vowels */
    var counts = {}; VH.forEach(function (v) { counts[v.v] = (counts[v.v] || 0) + 1; });
    var have = Object.keys(TXT.VOWELS).filter(function (id) { return counts[id]; });
    var vcard = h('div', { class: 'card' }, [h('p', { class: 'lb', text: 'Voyelles' })]);
    if (!have.length) {
      vcard.appendChild(h('p', { class: 'plain mut', text: 'Hold a vowel in Sons. Each take leaves a dot here.' }));
    } else {
      var sel = S.suiviVowel && counts[S.suiviVowel] ? S.suiviVowel : VH[VH.length - 1].v;
      S.suiviVowel = sel;
      var chips = h('div', { class: 'chips vchips', role: 'group', 'aria-label': 'Vowel' });
      have.forEach(function (id) {
        var V = TXT.VOWELS[id];
        chips.appendChild(h('button', { type: 'button', class: 'chip vchip', 'data-v': id, 'aria-pressed': id === sel ? 'true' : 'false', 'aria-label': V.spell + ', ' + counts[id] + ' takes', onclick: function () { S.suiviVowel = id; renderSuivi(); } }, [h('span', { class: 'sym', text: V.sym }), h('span', { class: 'n', text: String(counts[id]) })]));
      });
      vcard.appendChild(chips);
      var hs = histFor(sel, false, 20), okn = hs.filter(function (p) { return p.ok; }).length, V1 = TXT.VOWELS[sel];
      var ch = vowelChart({ target: sel, mates: [], scale: S.higher ? 1.15 : 1, hist: hs });
      vcard.appendChild(h('div', { class: 'svgbox', style: 'margin-top:10px' }, [ch.svg]));
      vcard.appendChild(h('p', { class: 'cap', id: 'vowelCap', text: 'Last ' + hs.length + ' takes of ' + V1.spell + ' /' + V1.sym + '/: ' + okn + ' landed in its zone (inside the zone and closest to this vowel). The newest dot is the darkest.' }));
    }
    out.appendChild(vcard);
    /* activity */
    var act = activityBars();
    out.appendChild(h('div', { class: 'card' }, [
      h('p', { class: 'lb', text: '14 jours' }),
      act.total ? h('div', { class: 'svgbox', style: 'margin-top:6px' }, [activitySvg(act)]) : h('p', { class: 'plain mut', text: 'No takes in the last 14 days.' }),
      h('p', { class: 'cap', text: act.total ? 'Takes per day: sentences, drills and vowels. ' + act.total + ' in total, at most ' + act.max + ' in one day.' : 'A bar is one day of takes (sentences, drills and vowels).' })
    ]));
    out.appendChild(h('div', { class: 'row wrapr', style: 'margin:4px 0 0' }, [
      h('button', { type: 'button', class: 'btn sm', id: 'exportBtn', text: 'Export takes (' + (ATT.length + VH.length) + ')', disabled: !(ATT.length + VH.length), onclick: exportAttempts })
    ]));
    out.appendChild(h('div', { id: 'exportBox' }));
  }
  function exportAttempts() {
    var json = JSON.stringify({ attempts: ATT, vowels: VH }, null, 1), box = $('exportBox'); if (box) clear(box);
    try {
      var blob = new Blob([json], { type: 'application/json' }), url = URL.createObjectURL(blob);
      var a = h('a', { href: url, download: 'dis-la-takes.json' });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { } }, 4000);
      toast('Takes exported.');
    } catch (e) {
      if (!box) return;
      box.appendChild(h('p', { class: 'cap', text: 'The download did not start. Copy this text instead:' }));
      var ta = h('textarea', { readonly: true, 'aria-label': 'Takes as JSON' }); ta.value = json; box.appendChild(ta);
      try { ta.focus(); ta.select(); } catch (e2) { }
    }
  }

  /* ==========================================================================================
     Settings sheet: theme, voice, word check, how a phrase result looks, the privacy line
     ========================================================================================== */
  var wordSwitches = [];
  function wordSwitch() {
    var on = S.wordsOn && !!SR_CLASS;
    var b = h('button', { type: 'button', class: 'sw', role: 'switch', 'aria-checked': on ? 'true' : 'false', 'aria-label': 'Word check', disabled: !SR_CLASS });
    b.addEventListener('click', function () { S.wordsOn = b.getAttribute('aria-checked') !== 'true'; store.set('dl-words', S.wordsOn ? 'on' : 'off'); syncWordSwitches(); });
    wordSwitches.push(b);
    return h('div', { class: 'swrow' }, [b, h('span', { text: SR_CLASS ? 'Word check' : 'Word check (not in this browser)' })]);
  }
  function syncWordSwitches() { wordSwitches.forEach(function (b) { b.setAttribute('aria-checked', S.wordsOn && SR_CLASS ? 'true' : 'false'); }); }
  function ipaSafe(t) {   /* IPA only for plain text: letters, spaces, apostrophes, hyphens, ordinary punctuation */
    t = String(t || '').trim();
    if (!t || t.length > TXT.MAXLEN) return false;
    try { return /^[\p{L}\p{M}\s'’\-.,;:!?«»"“”]+$/u.test(t); }
    catch (e) { return !/[0-9\/()\[\]<>=&{}→…]/.test(t); }
  }
  function ipaFor(t) { return ipaSafe(t) ? TXT.ipaSlashed(t) : ''; }

  var sheetFrom = null;
  function sheetRow(label, node) { return h('div', { class: 'srow' }, [h('p', { class: 'lb', text: label }), node]); }
  function buildSheet() {
    var p = clear($('sheetPanel'));
    p.appendChild(h('h2', { text: 'Réglages' }));
    p.appendChild(sheetRow('Theme', themeControl()));
    p.appendChild(sheetRow('Voice', voiceHost()));
    p.appendChild(sheetRow('Words', wordSwitch()));
    var lay = h('div', { class: 'seg sm', role: 'group', 'aria-label': 'Phrase result' });
    [['a', 'Chips'], ['b', 'Everything'], ['c', 'Pictures']].forEach(function (x) {
      lay.appendChild(h('button', { type: 'button', 'data-l': x[0], 'aria-pressed': S.layout === x[0] ? 'true' : 'false', text: x[1], onclick: function () {
        S.layout = x[0]; store.set('dl-layout', x[0]); S.openChip = null;
        Array.prototype.forEach.call(lay.children, function (b) { b.setAttribute('aria-pressed', b.dataset.l === x[0] ? 'true' : 'false'); });
        if (S.res.phrases) renderPhrase(S.res.phrases);
      } }));
    });
    p.appendChild(sheetRow('Phrase result', lay));
    p.appendChild(h('p', { class: 'cap', text: 'Recording and analysis happen on this device. Word recognition is done by the browser\'s own service (Apple or Google), which may receive the audio. Your takes stay in this browser.' }));
    p.appendChild(h('p', { class: 'cap', text: 'Dis-la 3.2' }));
    p.appendChild(h('div', { class: 'row' }, [h('button', { type: 'button', class: 'btn', id: 'sheetClose', html: ICON.close + '<span>Close</span>', onclick: closeSheet })]));
  }
  function openSheet() {
    if (REC || S.busy) return;
    buildSheet();
    sheetFrom = document.activeElement;
    $('sheet').hidden = false; document.documentElement.classList.add('sheet-open');
    var c = $('sheetClose'); if (c) c.focus();
  }
  function closeSheet() {
    var sh = $('sheet'); if (sh.hidden) return;
    sh.hidden = true; document.documentElement.classList.remove('sheet-open');
    try { if (sheetFrom && sheetFrom.focus) sheetFrom.focus(); } catch (e) { }
    sheetFrom = null;
  }

  /* ==========================================================================================
     Modes and start-up
     ========================================================================================== */
  var MODES = [['phrases', 'Phrases'], ['sons', 'Sons'], ['libre', 'Libre'], ['suivi', 'Suivi']];
  function buildModes() {
    var seg = clear($('modes'));
    MODES.forEach(function (m) {
      seg.appendChild(h('button', { type: 'button', role: 'tab', id: 'tab-' + m[0], 'aria-selected': S.mode === m[0] ? 'true' : 'false', 'aria-controls': 'm-' + m[0], text: m[1], onclick: function () { showMode(m[0]); } }));
    });
  }
  function showMode(m) {
    if ((REC || S.busy) && m !== S.mode) return;
    S.mode = m; store.set('dl-mode', m);
    MODES.forEach(function (x) {
      var on = x[0] === m;
      $('m-' + x[0]).hidden = !on;
      $('tab-' + x[0]).setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (m === 'suivi') renderSuivi();
    stopSpeech(); stopPlayback(); setDock();
  }
  function pruneHosts() {
    voiceHosts = voiceHosts.filter(function (e) { return document.body.contains(e); });
    wordSwitches = wordSwitches.filter(function (e) { return document.body.contains(e); });
    lentChips = lentChips.filter(function (e) { return document.body.contains(e); });
  }

  /* Links from other pages: #s=<sentence> opens Phrases on that sentence, #q=<sentence|sentence|...> starts a session of up to
     12 sentences, #m=sons, #m=libre or #m=suivi opens a mode. Nothing starts by itself (no microphone, no sound). The hash is
     never rewritten by this page. A link that arrives during a take waits until the take is done. */
  var hashTimer = null;
  function applyHash(tries) {
    var q = TXT.parseHash(location.hash);
    setLessonsLink(q);
    if (q.s == null && !q.m && !q.q && !q.k) return;
    if (REC || S.busy) {
      clearTimeout(hashTimer);
      if ((tries || 0) < 80) hashTimer = setTimeout(function () { applyHash((tries || 0) + 1); }, 500);
      return;
    }
    closeSheet();
    if (q.q) {
      S.q = { list: q.q, i: 0, done: {}, summary: false, t0: Date.now() };
      S.custom = ''; var inq = $('custom'); if (inq) inq.value = ''; openCustomRow(false);
      showMode('phrases'); stopSpeech(); clearResult(); updateSentence(); renderSummary(); renderStrip(); setDock(); window.scrollTo(0, 0);
    } else if (q.s != null) {
      S.q = null; renderSummary();
      showMode('phrases');
      var i = TXT.bankIndexOf(q.s), inp = $('custom');
      if (i >= 0) { S.idx = i; store.set('dl-idx', String(i)); if (inp) inp.value = ''; openCustomRow(false); setCustom(''); }
      else { if (inp) inp.value = q.s; openCustomRow(true); setCustom(q.s); }
      stopSpeech(); clearResult(); updateSentence(); renderStrip(); window.scrollTo(0, 0);
    } else if (q.k) { openSound(q.k); window.scrollTo(0, 0); }
    else showMode(q.m);
  }

  function init() {
    applyTheme(themeNow());
    buildModes(); buildPhrases(); buildSons(); buildLibre(); buildSuivi();
    var back = $('back'); back.href = FQ_URL;
    syncLessonsBtn();
    $('gear').addEventListener('click', openSheet);
    $('sheetBack').addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    pickVoice();
    if (synth) { try { synth.onvoiceschanged = pickVoice; } catch (e) { } }
    showMicNote(micProblem());
    showMode(S.mode);
    applyHash(0);
    window.addEventListener('hashchange', function () { applyHash(0); });
    window.addEventListener('resize', function () { setDock(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { if (REC) stopNow(); stopSpeech(); stopPlayback(); } });
    setInterval(pruneHosts, 15000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();


</script>
</body>
