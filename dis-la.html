/* ==========================================================================================

   KNOWN LIMITS (read before trusting any number):

     impossible. The ending (rising/falling/flat) uses only the last ~300 ms of voiced frames.

    if (res.audioState !== 'ok') {
      var b = block('Rhythm and melody', null, '', h('div', {}, [plain(audioMsg(res))]));
      if (res.audioState === 'dead' && S.wordsOn && recogWasLive(res)) b.lastChild.appendChild(h('p', {}, [h('button', { type: 'button', class: 'btn sm', text: 'Record audio only', onclick: function () { audioOnly(); } })]));
      out.appendChild(b);
    } else {
      out.appendChild(rhythmBlock(res)); out.appendChild(melodyBlock(res, true));
    }
    var fb = fixBlock(res.coach); if (fb) out.appendChild(fb);
  }
  function audioOnly() {
    S.wordsOn = false; store.set('dl-words', 'off'); syncWordSwitches(); clearResult(); startRec();
  }
  function emptyResult(take) {
    var msg = take.audioState === 'short' ? 'The take was too short. Tap record, speak, then pause.' :
      (take.audioState === 'dead' && take.recog.state !== 'ok' ? audioMsg({ audioState: 'dead', recog: take.recog }) : 'No voice was heard. Check that the microphone is not muted, then try again.');
    return { empty: true, msg: msg, dead: take.audioState === 'dead' && S.wordsOn && recogWasLive({ recog: take.recog }) };
  }
  function emptyBlock(res) {
    var body = h('div', {}, [plain(res.msg)]);
    if (res.dead) body.appendChild(h('p', {}, [h('button', { type: 'button', class: 'btn sm', id: 'audioOnly', text: 'Record audio only', onclick: function () { audioOnly(); } })]));
    return block('Result', null, '', body);
  }
  function onPhraseDone(take) {
    S.take.phrases = take;
    var usable = take.audioState === 'ok' || take.recog.state === 'ok';
    if (!usable) { S.res.phrases = emptyResult(take); renderPhrase(S.res.phrases); return; }
    var res = analysePhrase(take, take.target);
    S.res.phrases = res; renderPhrase(res);
    var pats = [];
    (res.words || []).forEach(function (w) { w.patterns.forEach(function (p) { if (pats.indexOf(p) < 0) pats.push(p); }); });
    saveAttempt({
      t: new Date().toISOString(), mode: 'phrase', sentence: res.target,
      words: (res.words || []).map(function (w) { return { word: w.raw, ok: w.ok, heard: w.heard.join(' ') }; }),
      missed: (res.words || []).filter(function (w) { return !w.ok; }).map(function (w) { return w.raw; }),
      patterns: pats,
      rhythm: res.rhythm ? { syllables: res.rhythm.n, expected: [res.est.lo, res.est.hi], perSecond: res.rhythm.rate == null ? null : +res.rhythm.rate.toFixed(2), evenness: res.rhythm.cv == null ? null : +res.rhythm.cv.toFixed(3), lastLonger: res.rhythm.lastLonger, count: res.rhythm.verdict } : null,
      melody: res.melody ? { sentenceType: res.type, ending: res.melody.dir, ok: res.melody.ok } : null,
      wordsState: take.recog.state, audioState: take.audioState
    });
    renderStrip(); renderFoot();
  }

  /* ==========================================================================================
     LIBRE
     ========================================================================================== */
  function buildLibre() {
    var root = clear($('m-libre'));
    var card = h('div', { class: 'card' }, [
      h('p', { class: 'lb', text: 'Libre' }),
      h('p', { class: 'sent-text', text: 'Say anything in French.' }),
      wordSwitch()
    ]);
    root.appendChild(card);
    root.appendChild(h('div', { id: 'liOut' }));
  }
  function analyseLibre(take) {
    var res = { type: null, est: null, audioState: take.audioState, recog: take.recog };
    if (take.audioState === 'ok') { var f = audioFeatures(take, null, null); res.a = f.a; res.rhythm = f.rhythm; res.melody = f.melody; }
    var words = null;
    if (take.recog.state === 'ok') { res.segs = TXT.libreAnalysis(take.recog.segs); words = TXT.unclearForCoach(res.segs); res.unclear = words; }
    res.coach = TXT.coach({ mode: 'libre', words: words, recog: take.recog.state, rhythm: res.rhythm || null, melody: null });
    return res;
  }
  function transcriptBlock(res) {
    if (res.recog.state !== 'ok') return block('Heard', null, '', plain(recogMessage(res.recog.state, 'libre')));
    var body = h('div', {}), minConf = 1, any = false;
    res.segs.forEach(function (sg) {
      var line = h('p', { class: 'plain seg-line', lang: 'fr' });
      sg.words.forEach(function (w, i) { line.appendChild(h('span', { class: w.unclear ? 'uncl' : '', text: w.raw })); if (i < sg.words.length - 1) line.appendChild(document.createTextNode(' ')); });
      body.appendChild(line);
      if (sg.conf != null) { any = true; minConf = Math.min(minConf, sg.conf); }
      var alts = [];
      sg.words.forEach(function (w) { if (w.unclear && w.alt.length) alts.push(w.raw + ' or ' + w.alt.join(' or ')); });
      if (alts.length) body.appendChild(h('p', { class: 'altline' }, ['Unsure: ', h('b', { text: alts.join(' · ') })]));
    });
    var tag = null, cls = '';
    if (any) { if (minConf >= 0.8) { tag = 'clear'; cls = 'ok'; } else { tag = 'unsure'; cls = 'warn'; } }
    return block('Heard', tag, cls, body);
  }
  function renderLibre(res) {
    var out = clear($('liOut'));
    if (res.empty) { out.appendChild(emptyBlock(res)); return; }
    if (res.recog.state !== 'off') out.appendChild(transcriptBlock(res));
    if (res.audioState !== 'ok') {
      var b = block('Rhythm and melody', null, '', h('div', {}, [plain(audioMsg(res))]));
      if (res.audioState === 'dead' && S.wordsOn && recogWasLive(res)) b.lastChild.appendChild(h('p', {}, [h('button', { type: 'button', class: 'btn sm', text: 'Record audio only', onclick: function () { audioOnly(); } })]));
      out.appendChild(b);
    } else { out.appendChild(rhythmBlock(res)); out.appendChild(melodyBlock(res, false)); }
    var fb = fixBlock(res.coach); if (fb) out.appendChild(fb);
  }
  function onLibreDone(take) {
    S.take.libre = take;
    if (!(take.audioState === 'ok' || take.recog.state === 'ok')) { S.res.libre = emptyResult(take); renderLibre(S.res.libre); return; }
    var res = analyseLibre(take); S.res.libre = res; renderLibre(res);
  }

  /* ==========================================================================================
     SONS
     ========================================================================================== */
  function sonCard() { return TXT.SONS.filter(function (x) { return x.id === S.son.card; })[0]; }
  function drillList() {
    return S.son.card === 'r' ? TXT.DRILLS.r : TXT.DRILLS.nas.filter(function (d) { return d.pat === S.son.grp; });
  }
  function currentDrill() { var l = drillList(); return l[((S.son.di % l.length) + l.length) % l.length]; }
  function buildSons() {
    var root = clear($('m-sons'));
    var tiles = h('div', { class: 'tiles', role: 'group', 'aria-label': 'Sounds' });
    TXT.SONS.forEach(function (c, i) {
      tiles.appendChild(h('button', { type: 'button', class: 'tile' + (i === TXT.SONS.length - 1 && TXT.SONS.length % 2 ? ' wide' : ''), 'data-id': c.id, 'aria-pressed': S.son.card === c.id ? 'true' : 'false', onclick: function () { selectCard(c.id); } },
        [h('b', { text: c.glyph }), h('span', { text: c.ipa })]));
    });
    root.appendChild(tiles);
    root.appendChild(h('div', { id: 'lab' }));
    root.appendChild(h('div', { id: 'soChart' }));
    root.appendChild(h('div', { id: 'soOut' }));
    renderLab();
  }
  function selectCard(id) {
    if (REC || S.busy) return;
    S.son.card = id; var c = sonCard();
    if (c.kind === 'vowel') S.son.target = c.vowels[0]; else { S.son.grp = 'nasal-on'; S.son.di = 0; }
    S.res.sons = null; S.take.sons = null; stopPlayback(); stopSpeech();
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (t) { t.setAttribute('aria-pressed', t.dataset.id === id ? 'true' : 'false'); });
    renderLab(); setDock();
  }
  function renderLab() {
    var lab = clear($('lab')), c = sonCard();
    clear($('soOut')); clear($('soChart'));
    var card = h('div', { class: 'card' });
    lab.appendChild(card);
    if (c.kind === 'vowel') {
      if (c.vowels.length > 1) {
        var seg = h('div', { class: 'seg sm', role: 'group', 'aria-label': 'Target vowel' });
        c.vowels.forEach(function (v) {
          var V = TXT.VOWELS[v];
          seg.appendChild(h('button', { type: 'button', 'aria-pressed': S.son.target === v ? 'true' : 'false', text: V.spell + '  /' + V.sym + '/', onclick: function () { S.son.target = v; S.res.sons = null; S.take.sons = null; renderLab(); setDock(); } }));
        });
        card.appendChild(seg);
      }
      var V0 = TXT.VOWELS[S.son.target];
      card.appendChild(h('div', { class: 'modelrow' }, [h('span', { class: 'w', text: V0.word, lang: 'fr' }), h('span', { class: 'ipa-line', text: TXT.ipaSlashed(V0.word) }), spkBtn(V0.word, false, 'Listen to ' + V0.word)]));
      card.appendChild(voiceHost());
      var sw = h('button', { type: 'button', class: 'sw', role: 'switch', 'aria-checked': S.higher ? 'true' : 'false', 'aria-label': 'My voice is higher' });
      sw.addEventListener('click', function () { S.higher = sw.getAttribute('aria-checked') !== 'true'; sw.setAttribute('aria-checked', S.higher ? 'true' : 'false'); store.set('dl-higher', S.higher ? '1' : '0'); drawChart(); if (S.res.sons && S.res.sons.v) rescoreVowel(); });
      card.appendChild(h('div', { class: 'swrow' }, [sw, h('span', { text: 'My voice is higher' })]));
      card.appendChild(h('p', { class: 'cap', text: 'Hold the sound for 1.5 s. Zones are approximate.' }));
      drawChart();
    } else {
      var list = drillList();
      if (c.id === 'nas') {
        var g = h('div', { class: 'seg sm', role: 'group', 'aria-label': 'Nasal vowel' });
        [['nasal-on', 'on  /ɔ̃/'], ['nasal-an', 'an  /ɑ̃/'], ['nasal-in', 'in  /ɛ̃/']].forEach(function (x) {
          g.appendChild(h('button', { type: 'button', 'aria-pressed': S.son.grp === x[0] ? 'true' : 'false', text: x[1], onclick: function () { S.son.grp = x[0]; S.son.di = 0; S.res.sons = null; S.take.sons = null; renderLab(); setDock(); } }));
        });
        card.appendChild(g);
      }
      var d = currentDrill();
      card.appendChild(h('p', { class: 'lb', style: 'margin-top:12px', text: 'Say' }));
      card.appendChild(h('div', { class: 'modelrow', style: 'margin-top:4px' }, [h('span', { class: 'w', style: 'font-size:40px', text: d.w, lang: 'fr' }), h('span', { class: 'ipa-line', text: TXT.ipaSlashed(d.w) }), spkBtn(d.w, false, 'Listen to ' + d.w)]));
      card.appendChild(h('div', { class: 'pair' }, [h('span', { text: 'not' }), h('b', { text: d.twin, lang: 'fr' }), h('span', { class: 'ipa-line', style: 'flex:none', text: TXT.ipaSlashed(d.twin) }), spkBtn(d.twin, true, 'Listen to ' + d.twin)]));
      card.appendChild(h('div', { class: 'navrow' }, [
        h('button', { type: 'button', class: 'btn rbtn', 'aria-label': 'Previous word', html: ICON.prev, onclick: function () { S.son.di--; S.res.sons = null; S.take.sons = null; renderLab(); setDock(); } }),
        h('button', { type: 'button', class: 'btn rbtn', 'aria-label': 'Next word', html: ICON.next, onclick: function () { S.son.di++; S.res.sons = null; S.take.sons = null; renderLab(); setDock(); } }),
        h('span', { class: 'cnt', text: (((S.son.di % list.length) + list.length) % list.length + 1) + ' / ' + list.length })
      ]));
      card.appendChild(voiceHost());
      if (!SR_CLASS) card.appendChild(h('p', { class: 'plain', text: recogMessage('unsupported', 'sons') }));
    }
  }
  function drawChart(meas) {
    var box = clear($('soChart')), c = sonCard();
    if (c.kind !== 'vowel') return;
    box.appendChild(h('div', { class: 'blk' }, [h('div', { class: 'svgbox' }, [vowelChart(S.son.target, c.vowels, S.higher ? 1.15 : 1, meas || null)])]));
  }
  function rescoreVowel() {
    var r = S.res.sons; if (!r || !r.fm) return;
    r.v = TXT.vowelVerdict(r.target, r.fm.f1, r.fm.f2, S.higher ? 1.15 : 1);
    renderVowelResult(r);
  }
  function renderVowelResult(r) {
    clear($('soOut'));
    drawChart(r.fm ? r : null);
    var out = $('soOut');
    if (r.err) { out.appendChild(block('Vowel', null, '', plain(r.err))); return; }
    var body = h('div', {}, [h('p', { class: 'verdict ' + (r.v.inZone && r.v.nearest === r.target ? 'ok' : 'bad'), text: r.v.line })]);
    if (r.v.tip) body.appendChild(plain(r.v.tip));
    body.appendChild(h('p', { class: 'nums', text: 'F1 ' + Math.round(r.fm.f1) + ' Hz · F2 ' + Math.round(r.fm.f2) + ' Hz · pitch ' + Math.round(r.f0) + ' Hz' }));
    if (r.f0 > 180) body.appendChild(h('p', { class: 'cap', text: 'High pitch: the F1 reading is rough.' }));
    out.appendChild(block('Vowel', 'estimate', '', body));
  }
  function onVowelDone(take) {
    S.take.sons = take;
    var target = take.target, res = { target: target };
    if (take.audioState !== 'ok') { res.err = take.audioState === 'nospeech' ? 'No voice was heard. Check that the microphone is not muted.' : audioMsg({ audioState: take.audioState }); }
    else {
      var a = DSP.analyzeTake(take.pcm, take.sr), st = DSP.steadyRun(a.pitch.f0, a.pitch.hop, 0.3);
      var fm = st ? DSP.formants(a.x, a.sr, st.a, st.b) : null;
      if (!st || !fm) res.err = 'No steady vowel found. Hold one sound for about 1.5 s, without a break.';
      else { res.fm = fm; res.f0 = a.medianF0; res.v = TXT.vowelVerdict(target, fm.f1, fm.f2, S.higher ? 1.15 : 1); }
    }
    S.res.sons = res; renderVowelResult(res);
  }
  function onDrillDone(take) {
    S.take.sons = take;
    var d = currentDrill(), out = clear($('soOut'));
    if (take.recog.state !== 'ok') {
      var msg = take.audioState === 'nospeech' || take.audioState === 'short' ? 'No voice was heard. Check that the microphone is not muted.' : recogMessage(take.recog.state, 'sons');
      S.res.sons = { empty: true, msg: msg }; out.appendChild(block('Heard', null, '', plain(msg))); return;
    }
    var alts = []; take.recog.segs.forEach(function (s) { s.alts.forEach(function (a) { alts.push(a); }); });
    var r = TXT.drillResult(d, alts), P = TXT.PATTERNS[d.pat];
    S.res.sons = { drill: d, r: r };
    var body = h('div', {});
    body.appendChild(h('p', { class: 'sent-text', style: 'margin:0 0 6px', text: r.heard, lang: 'fr' }));
    if (r.ok) body.appendChild(h('p', { class: 'verdict ok', text: 'Heard ' + d.w + '. Good.' }));
    else {
      body.appendChild(h('p', { class: 'verdict bad', text: r.kind === 'twin' ? 'That sounded like ' + d.twin + ', not ' + d.w + '.' : 'Not ' + d.w + '. Try again, clearly and alone.' }));
      body.appendChild(plain(P.tip));
      var ws = h('div', { class: 'words', style: 'margin-top:8px' });
      P.words.forEach(function (w) { ws.appendChild(h('span', { class: 'wchip' }, [h('span', { text: w }), spkBtn(w, true, 'Listen to ' + w)])); });
      body.appendChild(ws);
    }
    out.appendChild(block('Heard', r.ok ? 'ok' : null, 'ok', body));
    saveAttempt({ t: new Date().toISOString(), mode: 'drill', sentence: d.w, words: [{ word: d.w, ok: r.ok, heard: r.heard }], missed: r.ok ? [] : [d.w], patterns: r.ok ? [] : [d.pat], rhythm: null, melody: null, wordsState: 'ok', audioState: take.audioState });
    renderStrip(); renderFoot();
  }

  /* ==========================================================================================
     Footer: honesty line, export of attempts
     ========================================================================================== */
  function renderFoot() {
    var f = clear($('foot'));
    f.appendChild(h('p', { text: 'Recording and analysis happen on this device. Word recognition is done by the browser\'s own service (Apple or Google), which may receive the audio.' }));
    var row = h('div', { class: 'row' }, [
      h('button', { type: 'button', class: 'btn sm', id: 'exportBtn', text: 'Export attempts (' + ATT.length + ')', disabled: !ATT.length, onclick: exportAttempts })
    ]);
    f.appendChild(row);
    f.appendChild(h('div', { id: 'exportBox' }));
  }
  function exportAttempts() {
    var json = JSON.stringify(ATT, null, 1), box = clear($('exportBox'));
    try {
      var blob = new Blob([json], { type: 'application/json' }), url = URL.createObjectURL(blob);
      var a = h('a', { href: url, download: 'dis-la-attempts.json' });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { } }, 4000);
      toast('Attempts exported.');
    } catch (e) {
      box.appendChild(h('p', { class: 'cap', text: 'The download did not start. Copy this text instead:' }));
      var ta = h('textarea', { readonly: true, 'aria-label': 'Attempts as JSON' }); ta.value = json; box.appendChild(ta);
      try { ta.focus(); ta.select(); } catch (e2) { }
    }
  }

  /* ==========================================================================================
     Modes and start-up
     ========================================================================================== */
  var MODES = [['phrases', 'Phrases'], ['sons', 'Sons'], ['libre', 'Libre']];
  function buildModes() {
    var seg = clear($('modes'));
    MODES.forEach(function (m) {
      seg.appendChild(h('button', { type: 'button', role: 'tab', id: 'tab-' + m[0], 'aria-selected': S.mode === m[0] ? 'true' : 'false', 'aria-controls': 'm-' + m[0], text: m[1], onclick: function () { showMode(m[0]); } }));
    });
  }
  function showMode(m) {
    if ((REC || S.busy) && m !== S.mode) return;
    S.mode = m; store.set('dl-mode', m);
    MODES.forEach(function (x) {
      var on = x[0] === m;
      $('m-' + x[0]).hidden = !on;
      $('tab-' + x[0]).setAttribute('aria-selected', on ? 'true' : 'false');
    });
    stopSpeech(); stopPlayback(); setDock();
  }
  function pruneHosts() {
    voiceHosts = voiceHosts.filter(function (e) { return document.body.contains(e); });
    wordSwitches = wordSwitches.filter(function (e) { return document.body.contains(e); });
  }

  /* Links from other pages: #s=<sentence> opens Phrases on that sentence, #m=sons or #m=libre opens a mode.
     Nothing starts by itself (no microphone, no sound). The hash is never rewritten by this page. A link
     that arrives during a take waits until the take is done. */
  var hashTimer = null;
  function applyHash(tries) {
    var q = TXT.parseHash(location.hash);
    if (q.s == null && !q.m) return;
    if (REC || S.busy) {
      clearTimeout(hashTimer);
      if ((tries || 0) < 80) hashTimer = setTimeout(function () { applyHash((tries || 0) + 1); }, 500);
      return;
    }
    if (q.s != null) {
      showMode('phrases');
      var i = TXT.bankIndexOf(q.s), inp = $('custom');
      if (i >= 0) { S.idx = i; store.set('dl-idx', String(i)); if (inp) inp.value = ''; setCustom(''); }
      else { if (inp) inp.value = q.s; setCustom(q.s); }
      stopSpeech(); clearResult(); updateSentence(); window.scrollTo(0, 0);
    } else showMode(q.m);
  }

  function init() {
    buildTheme(); buildModes(); buildPhrases(); buildSons(); buildLibre(); renderFoot();
    pickVoice();
    if (synth) { try { synth.onvoiceschanged = pickVoice; } catch (e) { } }
    showMicNote(micProblem());
    showMode(S.mode);
    applyHash(0);
    window.addEventListener('hashchange', function () { applyHash(0); });
    window.addEventListener('resize', function () { setDock(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { if (REC) stopNow(); stopSpeech(); stopPlayback(); } });
    setInterval(pruneHosts, 15000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
